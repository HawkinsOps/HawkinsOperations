name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: self-hosted
    permissions:
      contents: read

    env:
      WAZUH_HOST: ${{ secrets.WAZUH_HOST }}
      WAZUH_SSH_USER: ${{ secrets.WAZUH_SSH_USER }}
      WAZUH_SSH_PORT: ${{ secrets.WAZUH_SSH_PORT }}
      WAZUH_SSH_KEY: ${{ secrets.WAZUH_SSH_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Generate verified counts markdown
        shell: pwsh
        run: |
          pwsh -NoProfile -File "./scripts/verify/generate-verified-counts.ps1" -OutFile "./PROOF_PACK/VERIFIED_COUNTS.md"
          pwsh -NoProfile -File "./scripts/verify/verify-counts.ps1"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install detection validation deps
        shell: bash
        run: python3 -m pip install --quiet pyyaml==6.0.2

      - name: Validate detection rule content
        shell: bash
        run: python3 ./scripts/verify/validate_detection_content.py

      - name: Run detection unit tests (Layer 1)
        shell: bash
        run: python3 ./scripts/verify/run_detection_unit_tests.py

      - name: Upload detection unit test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-unit-tests-summary
          path: |
            proof/detection_unit_tests/latest.json
            proof/detection_unit_tests/latest.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Generate site data artifacts
        shell: pwsh
        run: |
          node ./scripts/generate-metrics.js
          node ./scripts/generate-proof-lanes.js
          python3 ./scripts/validate_metrics.py
          node ./scripts/generate-site-data.js
          node ./scripts/generate-site-content.js
          node ./scripts/generate-media-manifest.js

      - name: Hosting consistency check
        shell: pwsh
        run: |
          node ./scripts/verify/hosting-cloudflare-only.js
          node ./scripts/verify/site-runtime-contract.js

      - name: Static site diagnosis gate
        shell: pwsh
        run: |
          node ./scripts/diagnose-site.js --fail-on-issues

      - name: Build Wazuh bundle
        shell: pwsh
        run: |
          pwsh -NoProfile -File "./scripts/build-wazuh-bundle.ps1"
          if (-not (Test-Path -LiteralPath "./dist/wazuh/local_rules.xml")) {
            throw "dist/wazuh/local_rules.xml was not generated"
          }
          Get-Item -LiteralPath "./dist/wazuh/local_rules.xml" | Select-Object Name, Length

      - name: Upload verified counts artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-counts
          path: PROOF_PACK/VERIFIED_COUNTS.md
          retention-days: 30

      - name: Upload wazuh bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: wazuh-rules-bundle
          path: dist/wazuh/local_rules.xml
          retention-days: 30
