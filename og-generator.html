<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap');
body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: #0a0e17;
  font-family: 'IBM Plex Sans', sans-serif;
  color: #e5edff;
  position: relative;
}
/* Scan-line texture */
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0, 212, 255, 0.015) 3px,
    rgba(0, 212, 255, 0.015) 4px
  );
  z-index: 1;
  pointer-events: none;
}
/* Grid dots */
body::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(1px 1px at 50% 50%, rgba(0, 212, 255, 0.12), transparent 70%);
  background-size: 40px 40px;
  z-index: 0;
  pointer-events: none;
}
/* Subtle gradient glow */
.glow {
  position: absolute;
  top: -100px;
  right: -100px;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(0, 212, 255, 0.06) 0%, transparent 70%);
  z-index: 0;
}
.glow2 {
  position: absolute;
  bottom: -80px;
  left: -80px;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(34, 197, 94, 0.04) 0%, transparent 70%);
  z-index: 0;
}
.content {
  position: relative;
  z-index: 2;
  padding: 60px 70px;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.top { }
.name {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 52px;
  font-weight: 700;
  letter-spacing: 0.03em;
  color: #f0f6ff;
  line-height: 1.1;
}
.role {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 22px;
  font-weight: 500;
  color: #00d4ff;
  margin-top: 14px;
  letter-spacing: 0.04em;
}
.url {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 15px;
  color: #4a5568;
  margin-top: 10px;
  letter-spacing: 0.06em;
}
.stats {
  display: flex;
  gap: 0;
  border: 1px solid rgba(0, 212, 255, 0.15);
  border-radius: 3px;
  background: rgba(17, 24, 39, 0.5);
}
.stat {
  padding: 18px 28px;
  text-align: center;
  border-right: 1px solid rgba(0, 212, 255, 0.08);
  flex: 1;
}
.stat:last-child { border-right: none; }
.stat .sv {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 28px;
  font-weight: 700;
  color: #00d4ff;
}
.stat .sl {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #4a5568;
  margin-top: 4px;
}
.stat.green .sv { color: #22c55e; }
.bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.logo {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  color: #2d3748;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.tagline {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: #2d3748;
  letter-spacing: 0.04em;
}
/* Top border accent */
.accent-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, #00d4ff, transparent);
  z-index: 3;
}
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="glow"></div>
<div class="glow2"></div>
<div class="content">
  <div class="top">
    <div class="name">RAYLEE HAWKINS</div>
    <div class="role">SOC Analyst | Detection Engineering | Security Automation</div>
    <div class="url">hawkinsops.com</div>
  </div>
  <div>
    <div class="stats">
      <div class="stat"><div class="sv">140</div><div class="sl">Detections</div></div>
      <div class="stat"><div class="sv">321,351+</div><div class="sl">Cases</div></div>
      <div class="stat green"><div class="sv">8/8</div><div class="sl">Hosts</div></div>
      <div class="stat green"><div class="sv">~88%</div><div class="sl">Auto-Close</div></div>
    </div>
  </div>
  <div class="bottom">
    <div class="logo">HawkinsOps</div>
    <div class="tagline">Working security operations system &middot; CI-verified &middot; reproducible</div>
  </div>
</div>
</body>
</html>
