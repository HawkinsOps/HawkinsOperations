<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <style>
      @keyframes dataPulse {
        0%   { stroke-dashoffset: 20; opacity: 0.2; }
        50%  { opacity: 0.8; }
        100% { stroke-dashoffset: 0;  opacity: 0.2; }
      }
      @keyframes nodePop {
        from { opacity: 0; transform: scale(0.94); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes pingRing {
        0%   { r: 10; opacity: 0.6; }
        100% { r: 28; opacity: 0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.2; }
      }

      .node { animation: nodePop 0.4s ease both; }
      .n1 { animation-delay: 0.0s; }
      .n2 { animation-delay: 0.15s; }
      .n3 { animation-delay: 0.30s; }
      .n4 { animation-delay: 0.45s; }
      .n5 { animation-delay: 0.60s; }

      .data-flow {
        fill: none;
        stroke-dasharray: 5 4;
        animation: dataPulse 2.2s linear infinite;
      }
      .df1 { stroke: #2e75b6; animation-delay: 0.0s; }
      .df2 { stroke: #00c4d4; animation-delay: 0.55s; }
      .df3 { stroke: #00c4d4; animation-delay: 1.1s; }
      .df4 { stroke: #e8a020; animation-delay: 0.3s; }

      .ping-ring { animation: pingRing 2.5s ease-out infinite; }
      .blink { animation: blink 2s ease-in-out infinite; }
    </style>

    <filter id="node-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="teal-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="amber-glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bg-blur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060910"/>
      <stop offset="100%" stop-color="#070c14"/>
    </linearGradient>
    <linearGradient id="proxmox-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101828"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="wazuh-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1824"/>
      <stop offset="100%" stop-color="#081018"/>
    </linearGradient>
    <linearGradient id="splunk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1e20"/>
      <stop offset="100%" stop-color="#061418"/>
    </linearGradient>
    <linearGradient id="endpoint-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101620"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="github-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1e26"/>
      <stop offset="100%" stop-color="#061418"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0b1520" stroke-width="0.4"/>
    </pattern>

    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2e75b6" opacity="0.8"/>
    </marker>
    <marker id="arr-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#00c4d4" opacity="0.8"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#e8a020" opacity="0.8"/>
    </marker>
    <marker id="arr-teal-rev" markerWidth="7" markerHeight="5" refX="1" refY="2.5" orient="auto">
      <polygon points="7 0, 0 2.5, 7 5" fill="#00c4d4" opacity="0.6"/>
    </marker>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#grid)" opacity="0.6"/>

  <!-- Ambient radial glows -->
  <radialGradient id="g1" cx="25%" cy="50%" r="30%">
    <stop offset="0%" stop-color="#2e75b6" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#2e75b6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g2" cx="75%" cy="40%" r="30%">
    <stop offset="0%" stop-color="#00c4d4" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#00c4d4" stop-opacity="0"/>
  </radialGradient>
  <rect width="960" height="540" fill="url(#g1)"/>
  <rect width="960" height="540" fill="url(#g2)"/>

  <!-- ── HEADER ── -->
  <rect x="0" y="0" width="960" height="50" fill="#060910"/>
  <line x1="0" y1="50" x2="960" y2="50" stroke="#131d2a" stroke-width="1"/>
  <rect x="0" y="0" width="960" height="2" fill="#2e75b6" opacity="0.5"/>
  <text x="28" y="18" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="3" fill="#2a4060">LAB ARCHITECTURE</text>
  <text x="28" y="38" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#b8d0e8">HawkinsOps — Detection &amp; Response Environment</text>
  <!-- Status -->
  <circle cx="870" cy="25" r="4" fill="#3a9060" class="blink"/>
  <text x="882" y="29" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3a7050">OPERATIONAL</text>
  <!-- RFC note -->
  <rect x="760" y="34" width="162" height="14" rx="2" fill="#080c14" stroke="#131d2a" stroke-width="1"/>
  <text x="841" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#1e3048">RFC1918 isolated subnets</text>

  <!-- ── PROXMOX HOST (CENTER-LEFT, LARGE) ── -->
  <!-- Background glow blob -->
  <ellipse cx="200" cy="290" rx="160" ry="120" fill="#2e75b6" opacity="0.04" filter="url(#bg-blur)"/>

  <g class="node n1">
    <!-- Main host box -->
    <rect x="60" y="90" width="280" height="320" rx="10" fill="url(#proxmox-grad)" stroke="#2e75b6" stroke-width="1.5"/>
    <rect x="60" y="90" width="280" height="4" rx="3" fill="#2e75b6"/>
    <!-- Header -->
    <text x="80" y="118" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="2.5" fill="#2e75b6">PROXMOX HOST</text>
    <text x="80" y="136" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#c8d8ec">[REDACTED_HOST]</text>
    <line x1="80" y1="148" x2="320" y2="148" stroke="#131d2a" stroke-width="1"/>
    <!-- Specs -->
    <text x="80" y="166" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3a5870">Hypervisor: Proxmox VE</text>
    <text x="80" y="182" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3a5870">GPU: 2× Tesla V100 (32GB)</text>
    <text x="80" y="198" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3a5870">Network: RFC1918 isolated</text>
    <text x="80" y="214" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3a5870">Snapshots: detection-scenario driven</text>
    <line x1="80" y1="224" x2="320" y2="224" stroke="#0e1820" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- VM sub-boxes inside Proxmox -->
    <text x="80" y="242" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" letter-spacing="2" fill="#1e3048">VIRTUAL MACHINES</text>

    <!-- VM: Wazuh Manager -->
    <rect x="78" y="250" width="116" height="52" rx="4" fill="#0d1a26" stroke="#1a3040" stroke-width="1"/>
    <rect x="78" y="250" width="116" height="3" rx="2" fill="#2e75b6" opacity="0.6"/>
    <text x="88" y="266" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" letter-spacing="1.5" fill="#2a5878">WAZUH MGR</text>
    <text x="88" y="282" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7a9ab8">Alert collection</text>
    <text x="88" y="296" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7a9ab8">Rule engine</text>

    <!-- VM: Splunk -->
    <rect x="204" y="250" width="116" height="52" rx="4" fill="#0a1e20" stroke="#1a3038" stroke-width="1"/>
    <rect x="204" y="250" width="116" height="3" rx="2" fill="#00c4d4" opacity="0.6"/>
    <text x="214" y="266" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" letter-spacing="1.5" fill="#2a6878">SPLUNK</text>
    <text x="214" y="282" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6a9aaa">Investigation</text>
    <text x="214" y="296" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6a9aaa">SPL queries</text>

    <!-- VM: AutoSOC Engine -->
    <rect x="78" y="312" width="242" height="52" rx="4" fill="#0a1420" stroke="#1a2a38" stroke-width="1"/>
    <rect x="78" y="312" width="242" height="3" rx="2" fill="#00c4d4" opacity="0.9"/>
    <text x="88" y="328" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" letter-spacing="1.5" fill="#2a7888">AUTOSOC ENGINE — SignalFoundry</text>
    <text x="88" y="344" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6aaaba">20-script Python pipeline · run-factory.ps1 orchestrator</text>
    <text x="88" y="358" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6aaaba">Ingest → Triage → Redact → Pack → Reconcile → Publish</text>

    <!-- Corner tag -->
    <rect x="258" y="98" width="68" height="18" rx="3" fill="#0a1830" stroke="#1a3050" stroke-width="1"/>
    <text x="292" y="111" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2e75b6">Donated HW</text>
  </g>

  <!-- ── WINDOWS ENDPOINT (TOP RIGHT) ── -->
  <ellipse cx="670" cy="180" rx="100" ry="70" fill="#3a6080" opacity="0.04" filter="url(#bg-blur)"/>

  <!-- Ping ring animation on endpoint -->
  <circle cx="672" cy="178" r="10" fill="none" stroke="#2e75b6" stroke-width="1" class="ping-ring" opacity="0.5"/>

  <g class="node n2">
    <rect x="560" y="90" width="220" height="178" rx="8" fill="url(#endpoint-grad)" stroke="#2a4060" stroke-width="1.2"/>
    <rect x="560" y="90" width="220" height="3" rx="3" fill="#2e75b6" opacity="0.7"/>
    <text x="580" y="115" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="2" fill="#2a5070">ENDPOINT</text>
    <text x="580" y="133" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#b8c8e0">Windows 11</text>
    <line x1="580" y1="143" x2="760" y2="143" stroke="#131d2a" stroke-width="1"/>
    <text x="580" y="161" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3a5068">Wazuh Agent: active</text>
    <text x="580" y="177" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3a5068">Sysmon: configured</text>
    <text x="580" y="193" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3a5068">Log forwarding: enabled</text>
    <text x="580" y="209" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3a5068">Telemetry: real, not simulated</text>
    <!-- Agent status -->
    <circle cx="582" cy="236" r="4" fill="#3a9060" class="blink"/>
    <text x="594" y="240" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3a7050">Agent reporting</text>
    <!-- Snapshot tag -->
    <rect x="580" y="252" width="178" height="6" rx="2" fill="#131d2a"/>
    <rect x="580" y="252" width="80" height="6" rx="2" fill="#2e75b6" opacity="0.4"/>
    <text x="669" y="270" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2a4060">Snapshot-repeatable</text>
  </g>

  <!-- ── WAZUH MANAGER NODE (STANDALONE LABEL) ── -->
  <g class="node n3">
    <rect x="560" y="310" width="220" height="130" rx="8" fill="url(#wazuh-grad)" stroke="#1e3a52" stroke-width="1.2"/>
    <rect x="560" y="310" width="220" height="3" rx="3" fill="#2e75b6" opacity="0.8"/>
    <text x="580" y="333" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="2" fill="#2a5878">WAZUH MANAGER</text>
    <text x="580" y="351" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#b0c8de">Alert Collection Layer</text>
    <line x1="580" y1="361" x2="760" y2="361" stroke="#0e1e2a" stroke-width="1"/>
    <text x="580" y="379" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3a5870">Receives agent telemetry</text>
    <text x="580" y="395" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3a5870">Fires alerts to AutoSOC</text>
    <text x="580" y="411" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3a5870">103 Sigma + 28 XML rules active</text>
    <rect x="580" y="420" width="140" height="12" rx="2" fill="#0a1820"/>
    <text x="650" y="430" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2a4060">Primary alerting layer</text>
  </g>

  <!-- ── GITHUB / PROOF OUTPUT NODE ── -->
  <g class="node n5">
    <rect x="800" y="200" width="132" height="148" rx="8" fill="url(#github-grad)" stroke="#1a3a48" stroke-width="1.2"/>
    <rect x="800" y="200" width="132" height="3" rx="3" fill="#00c4d4" opacity="0.8"/>
    <text x="818" y="222" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" letter-spacing="2" fill="#2a6878">PROOF OUTPUT</text>
    <text x="818" y="240" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#9ad0dc">GitHub + Site</text>
    <line x1="818" y1="250" x2="920" y2="250" stroke="#0e2030" stroke-width="1"/>
    <text x="818" y="268" font-family="'JetBrains Mono', monospace" font-size="9" fill="#3a7888">HawkinsOperations</text>
    <text x="818" y="284" font-family="'JetBrains Mono', monospace" font-size="9" fill="#3a7888">hawkinsops.com</text>
    <text x="818" y="300" font-family="'JetBrains Mono', monospace" font-size="9" fill="#3a7888">proof_pack/</text>
    <!-- Teal glow dot -->
    <circle cx="818" cy="318" r="4" fill="#00c4d4" filter="url(#teal-glow)" opacity="0.8" class="blink"/>
    <text x="830" y="322" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00c4d4">live</text>
    <rect x="800" y="208" width="3" height="132" rx="1" fill="#00c4d4" opacity="0.6"/>
  </g>

  <!-- ── DATA FLOW LINES ── -->

  <!-- Endpoint → Wazuh (agent telemetry, goes down) -->
  <line class="data-flow df1" stroke-width="2" x1="672" y1="268" x2="672" y2="308" marker-end="url(#arr-blue)"/>
  <!-- Label -->
  <rect x="676" y="282" width="88" height="14" rx="2" fill="#060910" opacity="0.8"/>
  <text x="680" y="293" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2a4060">agent telemetry</text>

  <!-- Wazuh → AutoSOC (alerts, goes left into Proxmox) -->
  <line class="data-flow df2" stroke-width="2" x1="558" y1="370" x2="346" y2="338" marker-end="url(#arr-teal)"/>
  <rect x="418" y="348" width="72" height="14" rx="2" fill="#060910" opacity="0.8"/>
  <text x="422" y="359" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2a6878">Wazuh alerts</text>

  <!-- AutoSOC → GitHub/Proof (publish output, right) -->
  <path class="data-flow df3" stroke-width="2" d="M 340 340 Q 540 280 798 278" marker-end="url(#arr-teal)"/>
  <rect x="530" y="274" width="96" height="14" rx="2" fill="#060910" opacity="0.8"/>
  <text x="534" y="285" font-family="'JetBrains Mono', monospace" font-size="8" fill="#2a7888">proof artifacts →</text>

  <!-- Splunk ↔ investigation (bidirectional label) -->
  <line class="data-flow df4" stroke-width="1.5" x1="558" y1="276" x2="440" y2="340" marker-end="url(#arr-amber)"/>
  <rect x="462" y="298" width="82" height="14" rx="2" fill="#060910" opacity="0.8"/>
  <text x="466" y="309" font-family="'JetBrains Mono', monospace" font-size="8" fill="#6a6020">Splunk pivot</text>

  <!-- ── LEGEND ── -->
  <rect x="0" y="490" width="960" height="50" fill="#050810"/>
  <line x1="0" y1="490" x2="960" y2="490" stroke="#131d2a" stroke-width="1"/>

  <!-- Legend items -->
  <line x1="32" y1="515" x2="62" y2="515" stroke="#2e75b6" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="70" y="519" font-family="'JetBrains Mono', monospace" font-size="9" fill="#3a5870">Agent telemetry</text>

  <line x1="200" y1="515" x2="230" y2="515" stroke="#00c4d4" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="238" y="519" font-family="'JetBrains Mono', monospace" font-size="9" fill="#3a7888">Wazuh alerts / proof output</text>

  <line x1="420" y1="515" x2="450" y2="515" stroke="#e8a020" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="458" y="519" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6a6020">Splunk investigation</text>

  <text x="700" y="510" font-family="'JetBrains Mono', monospace" font-size="8" fill="#1e3048">hawkinsops.com</text>
  <text x="700" y="526" font-family="'JetBrains Mono', monospace" font-size="8" fill="#1a2838">Host details redacted — public-safe diagram</text>
</svg>
