  <text x="550" y="320" fill="#8B949E" font-family="JetBrains Mono, Consolas, monospace" font-size="20">triage.py</text>

  <rect x="920" y="220" rx="18" ry="18" width="300" height="150" fill="#11161D" stroke="#39BAE6" stroke-width="2"/>
  <text x="950" y="275" fill="#E6EDF3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">3. Redaction</text>
  <text x="950" y="320" fill="#8B949E" font-family="JetBrains Mono, Consolas, monospace" font-size="20">redact.py</text>

  <rect x="1320" y="220" rx="18" ry="18" width="180" height="150" fill="#11161D" stroke="#56D364" stroke-width="2"/>
  <text x="1350" y="275" fill="#E6EDF3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">4. Pack</text>
  <text x="1350" y="320" fill="#8B949E" font-family="JetBrains Mono, Consolas, monospace" font-size="18">assemble-pack.py</text>

  <line x1="420" y1="295" x2="520" y2="295" stroke="#6E7681" stroke-width="4"/>
  <polygon points="520,295 502,285 502,305" fill="#6E7681"/>
  <line x1="820" y1="295" x2="920" y2="295" stroke="#6E7681" stroke-width="4"/>
  <polygon points="920,295 902,285 902,305" fill="#6E7681"/>
  <line x1="1220" y1="295" x2="1320" y2="295" stroke="#6E7681" stroke-width="4"/>
