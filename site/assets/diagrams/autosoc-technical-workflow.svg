  <rect x="220" y="520" rx="18" ry="18" width="1160" height="220" fill="#0F141B" stroke="#30363D" stroke-width="2"/>
  <text x="260" y="585" fill="#E6EDF3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Operational Notes</text>
  <text x="260" y="635" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">• Known false positives can be auto-closed through deterministic handling rules</text>
  <text x="260" y="675" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">• Suspicious cases are packaged into reviewer-safe evidence artifacts</text>
  <text x="260" y="715" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">• Outputs are tied to reproducible proof references for portfolio validation</text>

