<svg width="1600" height="1100" viewBox="0 0 1600 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1100" fill="#0B0F14"/>
  <text x="90" y="90" fill="#E6EDF3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">AutoSOC Technical Workflow</text>
  <text x="90" y="130" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Operational flow from Wazuh alert intake to evidence publication</text>

  <rect x="120" y="220" rx="18" ry="18" width="300" height="150" fill="#11161D" stroke="#2F81F7" stroke-width="2"/>
  <text x="150" y="275" fill="#E6EDF3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">1. Alert Intake</text>
  <text x="150" y="320" fill="#8B949E" font-family="JetBrains Mono, Consolas, monospace" font-size="20">poll-alerts.py</text>

  <rect x="520" y="220" rx="18" ry="18" width="300" height="150" fill="#11161D" stroke="#F2CC60" stroke-width="2"/>
