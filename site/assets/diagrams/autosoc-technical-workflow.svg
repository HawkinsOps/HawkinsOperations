  <text x="540" y="890" fill="#E6EDF3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Escalation Output</text>
  <text x="540" y="935" fill="#8B949E" font-family="JetBrains Mono, Consolas, monospace" font-size="20">create-pr.py / incident pack / proof artifacts</text>
