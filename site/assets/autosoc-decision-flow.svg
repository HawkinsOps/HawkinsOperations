<rect x="0" y="0" width="900" height="58" fill="rgba(4,7,13,0.9)"/>
<line x1="0" y1="58" x2="900" y2="58" stroke="#0e1e30" stroke-width="1"/>
<rect x="0" y="0" width="900" height="2" fill="#00c4d4" opacity="0.4"/>
<text x="450" y="22" text-anchor="middle" font-size="8" font-weight="700" letter-spacing="3" fill="#2a4a68">AUTOSOC ENGINE · HAWKINSOPS.COM</text>
<text x="450" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#c8e0f4" letter-spacing="-.3">Wazuh Alert → Triage Decision → Auditable Output</text>
