<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720">
<defs>
  <style>
    @keyframes flowDown {
      0%   { stroke-dashoffset: 24; opacity: 0.3; }
      50%  { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }
    @keyframes nodeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseGreen { 0%,100%{opacity:1;r:4;} 50%{opacity:.25;r:2;} }
    @keyframes pulseAmber { 0%,100%{opacity:1;r:4;} 50%{opacity:.25;r:2;} }
    @keyframes pulseTeal  { 0%,100%{opacity:1;r:4;} 50%{opacity:.25;r:2;} }
    @keyframes blink      { 0%,100%{opacity:1;} 50%{opacity:.15;} }
    @keyframes drawPath   { from{stroke-dashoffset:var(--len,400);} to{stroke-dashoffset:0;} }
    @keyframes countIn    { from{opacity:0;transform:scale(.7);} to{opacity:1;transform:scale(1);} }

    text { font-family: 'JetBrains Mono', 'Courier New', monospace; }

    .flow-v { stroke-dasharray:7 5; animation: flowDown 1.4s linear infinite; fill:none; stroke-width:2; }
    .flow-l { stroke-dasharray:7 5; animation: flowDown 1.6s linear infinite; fill:none; stroke-width:1.5; animation-delay:.2s; }
    .flow-r { stroke-dasharray:7 5; animation: flowDown 1.6s linear infinite; fill:none; stroke-width:1.5; animation-delay:.4s; }

    .drawn { fill:none; stroke-width:2; stroke-dasharray:var(--len,400); stroke-dashoffset:var(--len,400); animation:drawPath .7s cubic-bezier(.16,1,.3,1) both; }
    .d1{animation-delay:.1s} .d2{animation-delay:.3s} .d3{animation-delay:.5s}
    .d4{animation-delay:.7s} .d5{animation-delay:.85s} .d6{animation-delay:1.0s}
    .d7{animation-delay:1.15s} .d8{animation-delay:1.3s} .d9{animation-delay:1.45s}

    .n { animation: nodeIn .4s ease both; }
    .n1{animation-delay:.05s} .n2{animation-delay:.2s} .n3{animation-delay:.35s}
    .n4{animation-delay:.5s}  .n5{animation-delay:.65s} .n6{animation-delay:.8s}
    .n7{animation-delay:.95s} .n8{animation-delay:1.1s} .n9{animation-delay:1.25s}

    .pg{animation:pulseGreen 2s ease-in-out infinite;}
    .pa{animation:pulseAmber 2.2s ease-in-out infinite;}
    .pt{animation:pulseTeal  1.8s ease-in-out infinite;}
    .bl{animation:blink 1.8s ease-in-out infinite;}
    .ci{animation:countIn .6s cubic-bezier(.16,1,.3,1) both;}
  </style>

  <filter id="glow-teal">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-green">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-sm">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
  </filter>

  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#04070d"/>
    <stop offset="100%" stop-color="#060a14"/>
  </linearGradient>
  <linearGradient id="wazuh-grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0e1a28"/>
    <stop offset="100%" stop-color="#081018"/>
  </linearGradient>
  <linearGradient id="pipeline-grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0a1e20"/>
    <stop offset="100%" stop-color="#061416"/>
  </linearGradient>
  <linearGradient id="decision-grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0d1a2a"/>
    <stop offset="100%" stop-color="#08101a"/>
  </linearGradient>
  <linearGradient id="benign-grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0a1e12"/>
    <stop offset="100%" stop-color="#060e0a"/>
  </linearGradient>
  <linearGradient id="fp-grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#1a1408"/>
    <stop offset="100%" stop-color="#0e0c04"/>
  </linearGradient>
  <linearGradient id="esc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0a1826"/>
    <stop offset="100%" stop-color="#060e18"/>
  </linearGradient>
  <linearGradient id="metrics-grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0c1020"/>
    <stop offset="100%" stop-color="#080c18"/>
  </linearGradient>

  <marker id="ah-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#00c4d4"/>
  </marker>
  <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#27c97a"/>
  </marker>
  <marker id="ah-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#e8a020"/>
  </marker>
  <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#2979c8"/>
  </marker>

  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="0.6" fill="rgba(100,160,200,0.12)"/>
  </pattern>
</defs>

<!-- BG -->
<rect width="900" height="720" fill="url(#bg)"/>
<rect width="900" height="720" fill="url(#dots)"/>
<!-- Ambient glows -->
<radialGradient id="a1" cx="50%" cy="30%" r="40%">
  <stop offset="0%" stop-color="#00c4d4" stop-opacity="0.07"/>
  <stop offset="100%" stop-color="#00c4d4" stop-opacity="0"/>
</radialGradient>
<radialGradient id="a2" cx="15%" cy="75%" r="30%">
  <stop offset="0%" stop-color="#27c97a" stop-opacity="0.06"/>
  <stop offset="100%" stop-color="#27c97a" stop-opacity="0"/>
</radialGradient>
<radialGradient id="a3" cx="85%" cy="75%" r="30%">
  <stop offset="0%" stop-color="#2979c8" stop-opacity="0.06"/>
  <stop offset="100%" stop-color="#2979c8" stop-opacity="0"/>
</radialGradient>
<rect width="900" height="720" fill="url(#a1)"/>
<rect width="900" height="720" fill="url(#a2)"/>
<rect width="900" height="720" fill="url(#a3)"/>

