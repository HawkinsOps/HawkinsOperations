abstract: >
  On April 1, 2026, the SignalFoundry pipeline crashed three times in 2.5 hours
  due to a TOCTOU race condition at 505,836-file queue depth. The race existed
  from inception but only surfaced at scale when glob-to-stat windows stretched
  to seconds. Fixed with 4 defensive guards across 2 files (~20 lines), verified
  under live load with 1,056 files vanishing during sort — zero unhandled
  exceptions. Pipeline recovered from sub-10-second crashes to 80+ minutes
  sustained processing. Zero data loss.
