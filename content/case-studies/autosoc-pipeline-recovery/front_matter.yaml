abstract: >
  On March 13, 2026, the SignalFoundry automated SOC pipeline stopped ingesting
  Wazuh alerts. Two root causes were identified in one session: a poller retry
  control-flow defect (URLError not entering retry path on first attempt) and a
  reconciliation scoping error (unscoped repo_ids list inflating mismatch count).
  Both fixes were surgical, pipeline restored to SUCCESS, and a locked authority
  snapshot was frozen on March 25 with 55,665 cases processed.
