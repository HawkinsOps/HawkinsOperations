title: SMB Data Exfiltration
id: abd07653-e24b-4a67-a101-52e38dcef8d8
status: experimental
description: Detects large file transfers over SMB to external shares
references:
    - https://attack.mitre.org/techniques/T1048/002/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.exfiltration
    - attack.t1048.002
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 5145
        ShareName|endswith: '$'
        RelativeTargetName|contains: '\\'
    condition: selection
falsepositives:
    - Legitimate file transfers
    - Network backups
level: low
