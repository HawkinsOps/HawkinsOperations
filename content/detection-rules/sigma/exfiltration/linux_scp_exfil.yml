title: Linux SCP Data Exfiltration
id: 8d358dc8-58d8-4336-9c3f-abbaf2847180
status: stable
description: Detects SCP usage for potential data exfiltration
references:
    - https://attack.mitre.org/techniques/T1048/002/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.exfiltration
    - attack.t1048.002
logsource:
    product: linux
    service: auditd
detection:
    selection:
        type: 'EXECVE'
        a0: 'scp'
    condition: selection
falsepositives:
    - Legitimate file transfers
    - Administrative activities
level: low
