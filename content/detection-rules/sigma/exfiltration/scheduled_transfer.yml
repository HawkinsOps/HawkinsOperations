title: Scheduled Data Transfer
id: 118bff2d-451c-41e9-bc2c-d4945d8ea81c
status: experimental
description: Detects scheduled tasks configured for data transfer
references:
    - https://attack.mitre.org/techniques/T1029/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.exfiltration
    - attack.t1029
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4698
        TaskContent|contains:
            - 'ftp'
            - 'curl'
            - 'wget'
            - 'Invoke-WebRequest'
    condition: selection
falsepositives:
    - Legitimate scheduled backups
    - Update mechanisms
level: medium
