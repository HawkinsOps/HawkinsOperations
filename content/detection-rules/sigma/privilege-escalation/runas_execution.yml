title: RunAs Command Execution
id: 1db6520c-3871-4aed-b9f4-10dfe3b58aca
status: stable
description: Detects use of runas command which may indicate privilege escalation attempts
references:
    - https://attack.mitre.org/techniques/T1134/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.privilege_escalation
    - attack.t1134
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        - Image|endswith: '\runas.exe'
        - OriginalFileName: 'RUNAS.EXE'
    condition: selection
falsepositives:
    - Legitimate administrative activities
    - Help desk operations
level: low
