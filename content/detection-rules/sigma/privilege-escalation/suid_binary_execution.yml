title: Suspicious SUID Binary Execution
id: 0202ff4c-a176-4671-9398-16fbf0b4e725
status: experimental
description: Detects execution of uncommon SUID binaries that may indicate privilege escalation
references:
    - https://attack.mitre.org/techniques/T1548/001/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.privilege_escalation
    - attack.t1548.001
logsource:
    product: linux
    service: auditd
detection:
    selection:
        type: 'EXECVE'
        a0|endswith:
            - '/nmap'
            - '/vim'
            - '/find'
            - '/bash'
            - '/more'
            - '/less'
            - '/nano'
            - '/cp'
    condition: selection
falsepositives:
    - Legitimate system administration
    - Custom SUID binaries in enterprise environments
level: medium
