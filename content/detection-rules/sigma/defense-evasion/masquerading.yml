title: Masquerading as Windows Process
id: 6e5b0cc6-10d8-4c9b-842f-95f7597a258d
status: stable
description: Detects processes masquerading as legitimate Windows processes from suspicious locations
references:
    - https://attack.mitre.org/techniques/T1036/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.defense_evasion
    - attack.t1036
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\svchost.exe'
            - '\lsass.exe'
            - '\csrss.exe'
            - '\smss.exe'
            - '\winlogon.exe'
    filter:
        Image|startswith:
            - 'C:\Windows\System32\'
            - 'C:\Windows\SysWOW64\'
    condition: selection and not filter
falsepositives:
    - Unlikely
level: critical
