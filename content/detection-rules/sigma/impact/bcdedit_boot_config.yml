title: Boot Configuration Modification
id: 590bf2c8-eb37-465c-92a7-583f9a86db68
status: stable
description: Detects modification of boot configuration often used by ransomware
references:
    - https://attack.mitre.org/techniques/T1490/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.impact
    - attack.t1490
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\bcdedit.exe'
        CommandLine|contains:
            - 'set'
            - 'recoveryenabled'
            - 'no'
    condition: selection
falsepositives:
    - Legitimate boot configuration changes
level: high
