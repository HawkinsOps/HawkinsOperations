title: Resource Hijacking - Cryptomining
id: 4c53613c-1609-4e58-a156-d7987083e473
status: stable
description: Detects cryptocurrency mining activity
references:
    - https://attack.mitre.org/techniques/T1496/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.impact
    - attack.t1496
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'xmrig'
            - 'stratum+tcp'
            - '--coin'
            - 'cryptonight'
            - 'minerd'
            - 'ccminer'
    condition: selection
falsepositives:
    - Authorized cryptocurrency mining
level: high
