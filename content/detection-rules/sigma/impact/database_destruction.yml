title: Database Destruction Activity
id: cb03afd6-8d0c-4cdd-9a24-545d455e152d
status: experimental
description: Detects database deletion or destruction commands
references:
    - https://attack.mitre.org/techniques/T1485/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.impact
    - attack.t1485
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'DROP DATABASE'
            - 'DELETE FROM'
            - 'TRUNCATE TABLE'
            - 'sqlcmd'
        CommandLine|contains:
            - 'DROP'
    condition: selection
falsepositives:
    - Database administration
    - Development activities
level: medium
