title: Ransomware File Encryption Activity
id: d8a8f5dd-b5a4-423a-9774-f87819826dca
status: stable
description: Detects potential ransomware file encryption based on file extensions and patterns
references:
    - https://attack.mitre.org/techniques/T1486/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.impact
    - attack.t1486
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|endswith:
            - '.encrypted'
            - '.locked'
            - '.crypto'
            - '.crypt'
            - '.cerber'
            - '.locky'
            - '.wcry'
            - '.wncry'
    condition: selection
falsepositives:
    - Legitimate encryption software
level: critical
