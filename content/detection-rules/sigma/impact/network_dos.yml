title: Network Denial of Service
id: 3ecddebc-b2ee-473f-8e6d-d7c9d3832533
status: experimental
description: Detects tools and commands used for network DoS attacks
references:
    - https://attack.mitre.org/techniques/T1498/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.impact
    - attack.t1498
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'hping'
            - 'loic'
            - 'slowloris'
    condition: selection
falsepositives:
    - Network testing tools
    - Penetration testing
level: high
