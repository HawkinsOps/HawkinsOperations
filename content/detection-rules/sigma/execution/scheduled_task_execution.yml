title: Suspicious Scheduled Task Execution
id: 060a8988-43e7-4771-9391-fcf6b3b194de
status: stable
description: Detects execution of suspicious scheduled tasks
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.execution
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: '\taskeng.exe'
    selection_schtasks:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/Create'
    condition: 1 of selection_*
falsepositives:
    - Legitimate scheduled tasks
    - System maintenance
level: low
