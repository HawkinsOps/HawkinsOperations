title: Process Discovery Commands
id: 9c7401f2-2daa-4178-8c72-a6accb0f0c6d
status: stable
description: Detects process enumeration commands
references:
    - https://attack.mitre.org/techniques/T1057/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.discovery
    - attack.t1057
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\tasklist.exe'
            - '\qprocess.exe'
    condition: selection
falsepositives:
    - Administrative activities
    - Monitoring scripts
level: low
