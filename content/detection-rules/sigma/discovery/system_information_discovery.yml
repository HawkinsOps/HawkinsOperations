title: System Information Discovery
id: 05ead163-f505-42f3-81e3-e8254ba641bc
status: stable
description: Detects system information discovery commands
references:
    - https://attack.mitre.org/techniques/T1082/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.discovery
    - attack.t1082
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\systeminfo.exe'
            - '\hostname.exe'
    condition: selection
falsepositives:
    - Administrative activities
    - Asset inventory scripts
level: low
