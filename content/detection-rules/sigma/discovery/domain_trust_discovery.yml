title: Domain Trust Discovery
id: 214dcf40-3274-4dd9-bcd8-db5ded6837ee
status: stable
description: Detects domain trust enumeration
references:
    - https://attack.mitre.org/techniques/T1482/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.discovery
    - attack.t1482
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'nltest /domain_trusts'
            - 'Get-ADTrust'
            - 'Get-ForestTrust'
    condition: selection
falsepositives:
    - Legitimate Active Directory administration
level: medium
