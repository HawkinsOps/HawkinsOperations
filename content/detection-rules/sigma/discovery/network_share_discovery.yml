title: Network Share Discovery
id: fc29fe6f-fab7-40de-8f7c-0866bd96a9ec
status: stable
description: Detects enumeration of network shares
references:
    - https://attack.mitre.org/techniques/T1135/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.discovery
    - attack.t1135
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'net view'
            - 'net share'
            - 'Get-SmbShare'
    condition: selection
falsepositives:
    - Administrative activities
    - Scripts
level: low
