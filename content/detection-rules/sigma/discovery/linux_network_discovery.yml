title: Linux Network Discovery
id: 617fd796-9fcc-4a5a-90c2-a576e3608d13
status: stable
description: Detects network discovery commands on Linux systems
references:
    - https://attack.mitre.org/techniques/T1016/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.discovery
    - attack.t1016
logsource:
    product: linux
    service: auditd
detection:
    selection:
        type: 'EXECVE'
        a0:
            - 'ifconfig'
            - 'ip'
            - 'netstat'
            - 'ss'
            - 'arp'
    condition: selection
falsepositives:
    - System administration
    - Network troubleshooting
level: low
