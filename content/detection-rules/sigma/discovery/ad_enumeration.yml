title: Active Directory Enumeration
id: e9bc1ab1-46df-4798-b5b3-9f055f53dfe6
status: stable
description: Detects Active Directory enumeration using PowerShell
references:
    - https://attack.mitre.org/techniques/T1087/002/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.discovery
    - attack.t1087.002
logsource:
    product: windows
    service: powershell
    definition: 'Script Block Logging must be enabled'
detection:
    selection:
        EventID: 4104
        ScriptBlockText|contains:
            - 'Get-ADUser'
            - 'Get-ADGroup'
            - 'Get-ADComputer'
            - 'Get-ADDomain'
            - 'Get-ADForest'
            - 'Get-DomainUser'
            - 'Get-DomainGroup'
    condition: selection
falsepositives:
    - Legitimate AD administration
    - Inventory scripts
level: low
