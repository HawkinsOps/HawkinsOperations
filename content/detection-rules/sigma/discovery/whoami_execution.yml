title: Whoami Command Execution
id: eadc1883-5fd9-44b5-88e1-851dc8a50aa0
status: stable
description: Detects execution of whoami command for user discovery
references:
    - https://attack.mitre.org/techniques/T1033/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.discovery
    - attack.t1033
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\whoami.exe'
    condition: selection
falsepositives:
    - Administrative scripts
    - Troubleshooting
level: low
