title: Pass-the-Hash Attack Detection
id: 0fbc6ab9-7b63-4139-9440-7a0cf04ee6dd
status: experimental
description: Detects potential pass-the-hash attacks
references:
    - https://attack.mitre.org/techniques/T1550/002/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.lateral_movement
    - attack.t1550.002
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4624
        LogonType: 3
        LogonProcessName: 'NtLmSsp'
        WorkstationName: ''
    filter:
        SubjectUserName|endswith: '$'
    condition: selection and not filter
falsepositives:
    - Some legitimate network authentications
level: medium
