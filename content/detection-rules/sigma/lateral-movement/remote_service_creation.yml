title: Remote Service Creation
id: 52a0c8f3-8e43-4e58-b6fa-119b14b83dab
status: stable
description: Detects remote service creation which may indicate lateral movement
references:
    - https://attack.mitre.org/techniques/T1021/002/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.lateral_movement
    - attack.persistence
    - attack.t1021.002
logsource:
    product: windows
    service: system
detection:
    selection:
        EventID: 7045
    filter:
        ServiceName|startswith:
            - 'Microsoft'
            - 'Windows'
    condition: selection and not filter
falsepositives:
    - Legitimate remote administration
    - Software deployment
level: medium
