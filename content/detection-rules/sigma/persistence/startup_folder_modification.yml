title: Startup Folder File Creation
id: dcc91621-ab68-4d22-ae06-ae318301b607
status: stable
description: Detects file creation in Windows startup folders for persistence
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: HawkinsOps SOC
date: 2025/01/15
modified: 2025/01/15
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|contains:
            - '\Start Menu\Programs\Startup\'
            - '\Microsoft\Windows\Start Menu\Programs\StartUp\'
    condition: selection
falsepositives:
    - Legitimate software installations
    - User-created shortcuts
level: medium
